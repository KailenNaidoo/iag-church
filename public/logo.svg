<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Globe/Circle background -->
  <circle cx="100" cy="140" r="60" fill="#1a3a5c" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Horizontal ring of globe -->
  <ellipse cx="100" cy="140" rx="60" ry="20" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Vertical ring of globe -->
  <ellipse cx="100" cy="140" rx="20" ry="60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Cross -->
  <rect x="90" y="10" width="20" height="100" rx="2" fill="#ffffff"/>
  <rect x="65" y="35" width="70" height="20" rx="2" fill="#ffffff"/>
  
  <!-- Open Bible -->
  <path d="M60 105 L100 115 L140 105 L140 130 L100 140 L60 130 Z" fill="#1a3a5c" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="100" y1="115" x2="100" y2="140" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Bible pages -->
  <path d="M62 107 L98 116 L98 138 L62 128 Z" fill="#224a6e" stroke="none"/>
  <path d="M102 116 L138 107 L138 128 L102 138 Z" fill="#224a6e" stroke="none"/>
  
  <!-- Text: INTERNATIONAL ASSEMBLIES OF GOD -->
  <text x="100" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">INTERNATIONAL</text>
  <text x="100" y="172" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">ASSEMBLIES OF GOD</text>
  
  <!-- IAG text -->
  <text x="100" y="198" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold" font-style="italic">IAG</text>
</svg>
