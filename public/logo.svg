<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Cross (behind, tilted slightly) -->
  <g transform="rotate(-8 100 70)">
    <rect x="90" y="8" width="20" height="120" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="60" y="42" width="80" height="20" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
  </g>

  <!-- Open Bible (behind shield, spreading out) -->
  <g>
    <path d="M40 96 Q70 84 98 96 L98 138 Q70 128 40 138 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M160 96 Q130 84 102 96 L102 138 Q130 128 160 138 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <!-- page lines -->
    <path d="M52 104 Q72 97 92 103" stroke="#c8d4dc" stroke-width="1.5" fill="none"/>
    <path d="M52 114 Q72 107 92 113" stroke="#c8d4dc" stroke-width="1.5" fill="none"/>
    <path d="M108 103 Q128 97 148 104" stroke="#c8d4dc" stroke-width="1.5" fill="none"/>
    <path d="M108 113 Q128 107 148 114" stroke="#c8d4dc" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Shield -->
  <path d="M62 96 L138 96 L138 150 Q138 190 100 206 Q62 190 62 150 Z"
        fill="#45b6e0" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Text: INTERNATIONAL ASSEMBLIES OF GOD -->
  <text x="100" y="118" text-anchor="middle" fill="#2b2b2b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="0.5">INTERNATIONAL</text>
  <text x="100" y="128" text-anchor="middle" fill="#2b2b2b" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" letter-spacing="0.5">ASSEMBLIES OF GOD</text>

  <!-- IAG lettering -->
  <text x="100" y="178" text-anchor="middle" fill="#2b2b2b" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" font-style="italic">IAG</text>
</svg>
